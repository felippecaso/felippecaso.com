# Site settings
title: Felippe Felisola Caso # site title
description: >-
  Felippe Felisola Caso, Lead Engineer in Analytics at Monzo Bank in London. Speaker, teacher and mentor in data, programming and career development.
timezone: Europe/London # set your timezone
image: assets/img/ogp.png # This image used for Open Graph more info https://ogp.me/
mode: light # default theme "dark" | "light"

# Multilingual settings
lang: en # default lang
languages: [en, pt]

# Profile settings
author:
  name: Felippe Felisola Caso # author name
  bios: # tell to the world
    - language: en
      bio: >-
        I'm a data leader, mentor, and musician with 18 years of coding experience. I lead teams to make sense of data, currently as a Lead Engineer in Analytics for Monzo Bank in London, where I implement AI-driven solutions to boost internal productivity. Alongside my career, I've been an active teacher and mentor in data, programming and career development since 2016.
    - language: pt
      bio: >-
        Sou líder de dados, mentor e músico, com 18 anos de experiência em programação. Lidero times que transformam dados em entendimento, hoje como Lead Engineer em Analytics no Monzo Bank, em Londres, onde implemento soluções com IA para aumentar a produtividade interna. Paralelamente à carreira, atuo como professor e mentor em dados, programação e desenvolvimento de carreira desde 2016.
  username: felippecaso # general username
  github: felippecaso # github username
  linkedin: felippecaso
  avatar: /assets/img/avatar.jpg # change with your own avatar

# URL settings
url: "https://www.felippecaso.com" #
baseurl:
permalink: /:title/
google_analytics: G-5EMSZ3STG5

# Collection setting
collections:
  posts:
    output: true

# Markdown settings
markdown: kramdown
highlighter: rouge
kramdown:
  syntax_highlighter: rouge

# Default front matter
defaults:
  - scope:
      path: ""
    values:
      layout: post
      comments: false

# Jekyll Compose default front matter
jekyll_compose:
  post_default_front_matter:
    modified:
    tags: []
    description:
  draft_default_front_matter:
    modified:
    tags: []
    description:

# Homepage limit posts
number_of_posts: 5

# Build settings
# theme: klise
sass:
  style: compressed

include:
  - _redirects
  - .htaccess

exclude:
  - CNAME
  - Gemfile
  - Gemfile.lock
  - wrangler.jsonc
  - LICENSE
  - CHANGELOG.md
  - README.md
  - node_modules
  - CODE_OF_CONDUCT.md
  - CONTRIBUTING.md
  - lighthouse.png
  - klise-*.gem
  - klise.gemspec

# Plugins
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-postfiles
